<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hari ini</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAFA; color: #18181B; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 56px 20px 16px; min-height: 0">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 600; color: #52525B">Selasa, 27 Okt</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Latihan hari ini</h1>
      </div>
      <span style="padding: 6px 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E4E4E7; font-size: 12px; font-weight: 700">Minggu 3/10</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 24px rgba(0,0,0,0.06)">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="padding: 5px 10px; border-radius: 8px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 800; letter-spacing: 0.06em">TEMPO</span>
        <span style="font-size: 13px; font-weight: 600; color: #52525B">~5 km</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">38</span>
        <span style="font-size: 18px; font-weight: 700; color: #52525B">menit</span>
      </div>
      <div style="display: flex; gap: 3px; height: 10px; border-radius: 5px; overflow: hidden" aria-hidden="true">
        <div style="flex: 12; background: #2563EB"></div>
        <div style="flex: 14; background: #F59E0B"></div>
        <div style="flex: 12; background: #2563EB"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px">
        <div style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2563EB"></span>Pemanasan</span><span style="color: #52525B">12 mnt, easy</span></div>
        <div style="display: flex; justify-content: space-between; font-weight: 700"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F59E0B"></span>Tempo</span><span>14 mnt @ 6:45 /km</span></div>
        <div style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2563EB"></span>Pendinginan</span><span style="color: #52525B">12 mnt, easy</span></div>
      </div>
      <a href="Timer.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 18px; background: #18181B; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 001.5.9l12-7.5a1 1 0 000-1.8l-12-7.5A1 1 0 007 4.5z"/></svg>
        Mulai latihan
      </a>
      <a href="WorkoutDetail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 36px; font-size: 14px; font-weight: 600; text-decoration: none">Lihat detail &amp; alasan latihan</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E4E7">
      <div style="display: flex; justify-content: space-between; font-size: 14px">
        <span style="font-weight: 700">Minggu ini</span>
        <span style="color: #52525B; font-weight: 600"><b style="color: #18181B">0</b> / 18 km</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span style="font-size: 11px; font-weight: 600; color: {{d.labelColor}}">{{d.label}}</span>
            <div style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; background: {{d.bg}}; border: {{d.border}}"><div style="width: 10px; height: 10px; border-radius: 5px; background: {{d.dot}}"></div></div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #52525B">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg>
      Tersinkron dengan Strava, 2 jam lalu
    </div>
  </div>

  <nav aria-label="Navigasi utama" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #E4E4E7; padding: 8px 8px 28px; background: #FFFFFF">
    <a href="Today.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #18181B; font-size: 11px; font-weight: 800; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hari ini</a>
    <a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</a>
    <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-6M11 17V6M16 17v-4M21 17V9"/></svg>Progres</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['Sen', 'rest'], ['Sel', 'today'], ['Rab', 'rest'], ['Kam', 'easy'], ['Jum', 'rest'], ['Sab', 'easy'], ['Min', 'long']
    ];
    var dot = { rest: '#E4E4E7', today: '#F59E0B', easy: '#2563EB', long: '#1E3A8A' };
    return {
      week: rows.map(function (r) {
        var t = r[1] === 'today';
        return { label: r[0], labelColor: t ? '#18181B' : '#71717A', dot: dot[r[1]], bg: t ? '#FFFBEB' : '#FFFFFF', border: t ? '2px solid #18181B' : '1px solid #E4E4E7' };
      })
    };
  }
}
</script>
</body>
</html>
