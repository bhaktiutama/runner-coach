<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 56px 20px 16px; min-height: 0">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 700; color: var(--text-muted)">Selasa, 27 Okt</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Latihan hari ini</h1>
      </div>
      <span style="padding: 6px 12px; border-radius: var(--radius-stadium); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--font-display); font-size: 13px; font-weight: 700">Minggu 3/10</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card)"><div aria-hidden="true" style="margin: -20px -20px 0; height: 190px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden"><img src="ds/lintas/imagery/track-aerial.webp" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block"></div><h2 style="margin: 6px 0 0; font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Istirahat</h2><p style="margin: 0; font-size: 15px; line-height: 1.45; color: var(--text-muted)">Hari ini istirahat. Jalan santai atau stretching boleh.</p><a href="WorkoutDetail.dc.html" style="display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 700; text-decoration: none; color: var(--primary-ink)">Berikutnya: Easy Run, Rab 28 Okt</a></div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line)">
      <div style="display: flex; justify-content: space-between; font-size: 14px">
        <span style="font-weight: 700">Minggu ini</span>
        <span style="color: var(--text-muted); font-weight: 600"><b style="font-family: var(--font-display); color: var(--text)">0</b> / 18 km</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="width: 100%; height: 44px; box-sizing: border-box; border-radius: var(--radius-stadium); background: {{d.bg}}; box-shadow: {{d.ring}}; outline: {{d.outline}}; outline-offset: 2px"></div>
            <span style="font-size: 12px; font-weight: {{d.weight}}; color: {{d.labelColor}}">{{d.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <a href="LogManual.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 700; color: var(--text); text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Catat lari manual</a>
  </div>
  <nav aria-label="Navigasi utama" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 28px; background: var(--surface); box-shadow: inset 0 1px 0 var(--line)"><a href="Today.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text); font-size: 12px; font-weight: 800; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: var(--surface-sunken); color: var(--text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Hari ini</a><a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Plan</a><a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-6M11 17V6M16 17v-4M21 17V9"/></svg></span>Progres</a><a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Profil</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['Sen', 'rest'], ['Sel', 'today'], ['Rab', 'rest'], ['Kam', 'easy'], ['Jum', 'rest'], ['Sab', 'easy'], ['Min', 'long']
    ];
    var fill = { rest: 'var(--surface-sunken)', today: 'var(--zone-tempo)', easy: 'var(--zone-easy)', long: 'var(--zone-long)' };
    return {
      week: rows.map(function (r) {
        var t = r[1] === 'today';
        var rest = r[1] === 'rest';
        return {
          label: r[0],
          labelColor: t ? 'var(--text)' : 'var(--text-muted)',
          weight: t ? 800 : 600,
          bg: rest ? fill.rest : 'transparent',
          ring: rest ? 'none' : 'inset 0 0 0 2.5px ' + fill[r[1]],
          outline: t ? '2px solid var(--text)' : 'none'
        };
      })
    };
  }
}
</script>
