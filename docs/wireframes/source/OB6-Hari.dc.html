<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding: hari latihan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lintas/tokens.css">
<link rel="stylesheet" href="ds/lintas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:var(--primary-ink)}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 16px; min-height: 0">
  <div style="display: flex; align-items: center; gap: 12px"><a href="OB5-Volume.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><div aria-hidden="true" style="flex: 1; display: flex; gap: 4px"><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--surface-sunken)"></div></div><span style="font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-muted)">5/6</span></div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Hari apa kamu bisa lari?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: var(--text-muted)">Pilih 3-6 hari. Hari lain otomatis jadi istirahat.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button type="button" aria-pressed="{{d.on}}" style="height: 64px; border: 0; border-radius: var(--radius-stadium); font-size: 13px; font-weight: 700; background: {{d.bg}}; color: {{d.fg}}; box-shadow: {{d.ring}}">{{d.label}}</button>
    </sc-for>
  </div>
  <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-md); background: var(--status-on-track); color: var(--on-status); font-size: 14px; line-height: 1.45"><span style="flex-shrink: 0; display: flex; padding-top: 1px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span><b>4 hari / minggu</b>: pas untuk plan 10K.</span></div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 700; color: var(--text-muted)">Hari long run (lari terpanjang)</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: var(--radius-stadium); background: var(--surface-sunken)"><button type="button" style="min-height: 44px; padding: 0 6px; border: 0; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600; white-space: nowrap">Sabtu</button><button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 6px; border: 0; border-radius: var(--radius-stadium); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: var(--shadow-card)">Minggu</button></div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line)">
    <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>Pengingat latihan</span>
    <span style="font-family: var(--font-display); font-size: 20px; font-weight: 800">05:30</span>
  </div>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 32px"><a href="OB7-Kesehatan.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: var(--radius-stadium); text-decoration: none; font-family: var(--font-ui); font-weight: 700; box-sizing: border-box; height: 60px; background: var(--primary); color: var(--on-primary); font-size: 17px; box-shadow: var(--shadow-raised)">Lanjut</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var names = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
    var on = { Sel: true, Kam: true, Sab: true, Min: true };
    return {
      days: names.map(function (n) {
        var o = !!on[n];
        return { label: n, on: o ? 'true' : 'false', bg: o ? 'var(--text)' : 'var(--surface)', fg: o ? 'var(--bg)' : 'var(--text)', ring: o ? 'none' : 'inset 0 0 0 1.5px var(--line)' };
      })
    };
  }
}
</script>
</body>
</html>
