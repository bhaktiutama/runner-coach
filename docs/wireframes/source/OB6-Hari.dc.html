<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding: hari latihan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: Inter, system-ui, sans-serif; padding: 56px 24px 40px; gap: 24px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="OB5-Volume.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #18181B; margin-left: -10px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <div style="height: 6px; border-radius: 3px; background: #18181B"></div>
      <div style="height: 6px; border-radius: 3px; background: #18181B"></div>
      <div style="height: 6px; border-radius: 3px; background: #18181B"></div>
      <div style="height: 6px; border-radius: 3px; background: #18181B"></div>
      <div style="height: 6px; border-radius: 3px; background: #18181B"></div>
      <div style="height: 6px; border-radius: 3px; background: #E4E4E7"></div>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #52525B">5/6</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Hari apa kamu bisa lari?</h1>
    <p style="margin: 0; font-size: 15px; color: #52525B">Pilih 3-6 hari. Hari lain otomatis jadi istirahat.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button type="button" aria-pressed="{{d.on}}" style="all: unset; box-sizing: border-box; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; font-size: 13px; font-weight: 700; background: {{d.bg}}; color: {{d.fg}}; border: {{d.border}}; cursor: pointer">{{d.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #ECFDF5; color: #065F46; font-size: 14px; line-height: 1.4">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6L9 17l-5-5"/></svg>
    <span><b>4 hari / minggu</b>: pas untuk plan 10K.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 600; color: #52525B">Hari long run (lari terpanjang)</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="all: unset; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1.5px solid #E4E4E7; font-size: 15px; font-weight: 600; cursor: pointer">Sabtu</button>
      <button type="button" aria-pressed="true" style="all: unset; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #18181B; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">Minggu</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 60px; border-radius: 16px; border: 1.5px solid #E4E4E7">
    <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
      Pengingat latihan
    </span>
    <span style="font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">05:30</span>
  </div>

  <div style="flex: 1"></div>
  <a href="OB7-Kesehatan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #18181B; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Lanjut</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var names = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
    var on = { Sel: true, Kam: true, Sab: true, Min: true };
    return {
      days: names.map(function (n) {
        var o = !!on[n];
        return { label: n, on: o ? 'true' : 'false', bg: o ? '#18181B' : '#FFFFFF', fg: o ? '#FFFFFF' : '#18181B', border: o ? '1.5px solid #18181B' : '1.5px solid #E4E4E7' };
      })
    };
  }
}
</script>
</body>
</html>
