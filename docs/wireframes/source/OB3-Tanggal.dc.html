<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding: tanggal race</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lintas/tokens.css">
<link rel="stylesheet" href="ds/lintas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:var(--primary-ink)}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 16px; min-height: 0">
  <div style="display: flex; align-items: center; gap: 12px"><a href="OB2-Target.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><div aria-hidden="true" style="flex: 1; display: flex; gap: 4px"><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--surface-sunken)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--surface-sunken)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--surface-sunken)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--surface-sunken)"></div></div><span style="font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-muted)">2/6</span></div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Kapan race 10K-mu?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: var(--text-muted)">Plan disusun mundur dari tanggal ini.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card)"><div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Bulan sebelumnya" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-sunken); color: var(--text); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span style="font-family: var(--font-display); font-size: 18px; font-weight: 800">Januari 2027</span>
      <button type="button" aria-label="Bulan berikutnya" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-sunken); color: var(--text); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted)"><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <div style="height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-stadium); font-family: var(--font-display); font-size: 16px; background: {{d.bg}}; color: {{d.fg}}; font-weight: {{d.weight}}">{{d.label}}</div>
      </sc-for>
    </div></div>
  <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-md); background: var(--status-on-track); color: var(--on-status); font-size: 14px; line-height: 1.45"><span style="flex-shrink: 0; display: flex; padding-top: 1px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span><b>Minggu, 3 Jan 2027</b>: 10 minggu lagi. Pas untuk plan 10K.</span></div>
  <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-muted)">Nama race (opsional)<input type="text" placeholder="Mis. [Nama race lokal]" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: var(--radius-sm); background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line-strong); font-family: var(--font-ui); font-size: 16px; font-weight: 600"></label>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 32px"><a href="OB4-Kemampuan.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: var(--radius-stadium); text-decoration: none; font-family: var(--font-ui); font-weight: 700; box-sizing: border-box; height: 60px; background: var(--primary); color: var(--on-primary); font-size: 17px; box-shadow: var(--shadow-raised)">Lanjut</a><a href="OB4-Kemampuan.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 15px; font-weight: 700; color: var(--primary-ink); text-decoration: none">Belum ada race, ingin lebih baik saja</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var days = [];
    for (var i = 0; i < 4; i++) days.push({ label: '', bg: 'transparent', fg: 'var(--text)', weight: 500 });
    for (var d = 1; d <= 31; d++) {
      var sel = d === 3;
      days.push({ label: String(d), bg: sel ? 'var(--primary)' : 'transparent', fg: sel ? 'var(--on-primary)' : 'var(--text)', weight: sel ? 800 : 500 });
    }
    return { days: days };
  }
}
</script>
</body>
</html>
