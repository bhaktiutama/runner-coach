<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding: tanggal race</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: Inter, system-ui, sans-serif; padding: 56px 24px 40px; gap: 24px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="OB2-Target.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #18181B; margin-left: -10px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <div style="height: 6px; border-radius: 3px; background: #18181B"></div>
      <div style="height: 6px; border-radius: 3px; background: #18181B"></div>
      <div style="height: 6px; border-radius: 3px; background: #E4E4E7"></div>
      <div style="height: 6px; border-radius: 3px; background: #E4E4E7"></div>
      <div style="height: 6px; border-radius: 3px; background: #E4E4E7"></div>
      <div style="height: 6px; border-radius: 3px; background: #E4E4E7"></div>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #52525B">2/6</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Kapan race 10K-mu?</h1>
    <p style="margin: 0; font-size: 15px; color: #52525B">Plan disusun mundur dari tanggal ini.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; border: 1.5px solid #E4E4E7">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Bulan sebelumnya" style="all: unset; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span style="font-size: 16px; font-weight: 700">Januari 2027</span>
      <button type="button" aria-label="Bulan berikutnya" style="all: unset; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; font-weight: 600; color: #71717A; text-align: center">
      <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <div style="height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 15px; font-weight: {{d.weight}}; background: {{d.bg}}; color: {{d.fg}}">{{d.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #EFF6FF; color: #1E3A8A; font-size: 14px; line-height: 1.4">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span><b>Minggu, 3 Jan 2027</b>: 10 minggu lagi. Pas untuk plan 10K.</span>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #52525B">Nama race (opsional)
    <input type="text" placeholder="Mis. [Nama race lokal]" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #E4E4E7; font: inherit; font-size: 15px; color: #18181B">
  </label>

  <div style="flex: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <a href="OB4-Kemampuan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #18181B; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Lanjut</a>
    <a href="OB4-Kemampuan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 600; color: #18181B; text-decoration: none">Belum ada race, ingin lebih baik saja</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var days = [];
    for (var i = 0; i < 4; i++) days.push({ label: '', bg: 'transparent', fg: '#18181B', weight: 500 });
    for (var d = 1; d <= 31; d++) {
      var sel = d === 3;
      days.push({ label: String(d), bg: sel ? '#18181B' : 'transparent', fg: sel ? '#FFFFFF' : '#18181B', weight: sel ? 800 : 500 });
    }
    return { days: days };
  }
}
</script>
</body>
</html>
