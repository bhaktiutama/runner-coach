<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Preview plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: Inter, system-ui, sans-serif; padding: 56px 24px 32px; gap: 20px; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #52525B">PLAN KAMU SIAP</span>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">10K dalam 10 minggu</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #F4F4F5">
      <span style="font-size: 12px; color: #52525B; font-weight: 600">Target</span>
      <span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">1:05:00</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #F4F4F5">
      <span style="font-size: 12px; color: #52525B; font-weight: 600">Per minggu</span>
      <span style="font-size: 18px; font-weight: 800">4 hari</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #F4F4F5">
      <span style="font-size: 12px; color: #52525B; font-weight: 600">Race</span>
      <span style="font-size: 18px; font-weight: 800">3 Jan</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700">Volume per minggu (km)</span>
    <div style="display: flex; align-items: flex-end; gap: 6px; height: 140px" role="img" aria-label="Grafik volume mingguan: naik dari 14 km ke puncak 24 km di minggu 7, lalu turun untuk taper">
      <sc-for list="{{weeks}}" as="w" hint-placeholder-count="10">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%">
          <span style="font-size: 10px; font-weight: 700; color: #52525B">{{w.km}}</span>
          <div style="width: 100%; border-radius: 6px; height: {{w.h}}; background: {{w.color}}"></div>
        </div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; font-size: 10px; color: #71717A; text-align: center; font-weight: 600">
      <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; font-weight: 600; color: #3F3F46">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #93C5FD"></span>Base</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #2563EB"></span>Build</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #F59E0B"></span>Peak</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #A1A1AA"></span>Taper</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; border: 1.5px solid #E4E4E7">
    <span style="font-size: 14px; font-weight: 700">Pace latihanmu</span>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2563EB"></span>Easy</span><b style="font-variant-numeric: tabular-nums">7:40 - 8:20 /km</b></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F59E0B"></span>Tempo</span><b style="font-variant-numeric: tabular-nums">6:45 /km</b></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #DC2626"></span>Interval</span><b style="font-variant-numeric: tabular-nums">6:15 /km</b></div>
  </div>

  <div style="flex: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 600; color: #52525B; text-align: center">Simpan plan supaya tidak hilang</span>
    <a href="Today.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; background: #18181B; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Lanjut dengan Apple</a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="Today.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; border: 1.5px solid #D4D4D8; color: #18181B; font-size: 15px; font-weight: 700; text-decoration: none">Google</a>
      <a href="Today.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; border: 1.5px solid #D4D4D8; color: #18181B; font-size: 15px; font-weight: 700; text-decoration: none">Email</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var km = [14, 16, 18, 15, 20, 22, 24, 20, 18, 12];
    var phase = ['#93C5FD', '#93C5FD', '#93C5FD', '#2563EB', '#2563EB', '#2563EB', '#F59E0B', '#F59E0B', '#A1A1AA', '#A1A1AA'];
    return {
      weeks: km.map(function (k, i) {
        return { km: k, h: Math.round(k / 24 * 110) + 'px', color: phase[i] };
      })
    };
  }
}
</script>
</body>
</html>
