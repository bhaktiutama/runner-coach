<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pindahkan latihan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FAFAFA; color: #18181B; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 56px 20px" aria-hidden="true">
    <div style="height: 28px; width: 140px; border-radius: 8px; background: #E4E4E7"></div>
    <div style="height: 14px; width: 220px; border-radius: 6px; background: #E4E4E7"></div>
    <div style="height: 10px; border-radius: 4px; background: #E4E4E7; margin-top: 12px"></div>
    <div style="height: 56px; border-radius: 16px; background: #FFFFFF; margin-top: 24px"></div>
    <div style="height: 56px; border-radius: 16px; background: #FFFFFF"></div>
    <div style="height: 56px; border-radius: 16px; background: #FFFFFF"></div>
    <div style="height: 56px; border-radius: 16px; background: #FFFFFF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(9, 9, 11, 0.5)"></div>

  <div role="dialog" aria-label="Pindahkan latihan" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 18px; padding: 12px 20px 36px; border-radius: 28px 28px 0 0; background: #FFFFFF">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D4D4D8"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 600; color: #52525B">Pindahkan latihan</span>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Easy + strides, 35 mnt</span>
        <span style="font-size: 13px; color: #52525B">Jadwal awal: Kamis, 29 Okt</span>
      </div>
      <a href="Plan.dc.html" aria-label="Tutup" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #F4F4F5; color: #18181B">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="all: unset; box-sizing: border-box; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: {{o.border}}">
          <span style="font-size: 12px; font-weight: 600">{{o.dow}}</span>
          <span style="font-size: 18px; font-weight: 800">{{o.date}}</span>
          <span style="width: 6px; height: 6px; border-radius: 3px; background: {{o.dot}}"></span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; background: {{msgBg}}; color: {{msgFg}}">
      <span>{{msg}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="Plan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #18181B; color: #FFFFFF; font-size: 16px; font-weight: 800; text-decoration: none">{{cta}}</a>
      <a href="Plan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 600; color: #B91C1C; text-decoration: none">Lewati latihan ini</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'Jum' };
  }
  renderVals() {
    var self = this;
    var o = [
      { dow: 'Rab', date: '28', dot: '#E4E4E7', level: 'ok', msg: 'Bisa. Sehari setelah Tempo, jadi tetap pelan dan lewati strides kalau kaki masih berat.' },
      { dow: 'Kam', date: '29', dot: '#2563EB', level: 'ok', msg: 'Ini jadwal awal.' },
      { dow: 'Jum', date: '30', dot: '#E4E4E7', level: 'ok', msg: 'Aman. Hari kosong dan tidak berurutan dengan sesi berat.' },
      { dow: 'Sab', date: '31', dot: '#2563EB', level: 'warn', msg: 'Sabtu sudah ada Easy Run. Dua latihan digabung jadi satu: Easy 50 mnt?' },
      { dow: 'Min', date: '1', dot: '#1E3A8A', level: 'warn', msg: 'Tidak disarankan: Minggu adalah Long Run. Lebih baik pilih Jumat.' }
    ];
    var cur = this.state.pick;
    var sel = o.filter(function (x) { return x.dow === cur; })[0];
    var warn = sel.level === 'warn';
    return {
      opts: o.map(function (x) {
        var on = x.dow === cur;
        return {
          dow: x.dow, date: x.date, dot: x.dot, pressed: on ? 'true' : 'false',
          bg: on ? '#18181B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#18181B',
          border: on ? '1.5px solid #18181B' : '1.5px solid #E4E4E7',
          pick: function () { self.setState({ pick: x.dow }); }
        };
      }),
      msg: sel.msg,
      msgBg: warn ? '#FFF7ED' : '#ECFDF5',
      msgFg: warn ? '#7C2D12' : '#065F46',
      cta: 'Pindahkan ke ' + sel.dow + ', ' + sel.date
    };
  }
}
</script>
</body>
</html>
