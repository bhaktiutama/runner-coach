<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pindahkan latihan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lintas/tokens.css">
<link rel="stylesheet" href="ds/lintas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:var(--primary-ink)}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 10px; padding: 56px 20px 0; opacity: .5"><div style="height: 28px; border-radius: var(--radius-md); background: var(--surface)"></div><div style="height: 56px; border-radius: var(--radius-md); background: var(--surface)"></div><div style="height: 56px; border-radius: var(--radius-md); background: var(--surface)"></div><div style="height: 56px; border-radius: var(--radius-md); background: var(--surface)"></div><div style="height: 56px; border-radius: var(--radius-md); background: var(--surface)"></div><div style="height: 56px; border-radius: var(--radius-md); background: var(--surface)"></div></div>
  <div style="flex: 1"></div>
  <div style="position: absolute; inset: 0; background: var(--text); opacity: .4"></div>
  <div role="dialog" aria-label="Pindahkan latihan" style="position: relative; display: flex; flex-direction: column; gap: 18px; padding: 12px 20px 32px; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; background: var(--bg); box-shadow: var(--shadow-raised)">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: var(--radius-stadium); background: var(--line-strong)"></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: var(--font-display); font-size: 22px; font-weight: 800">Pindahkan latihan</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span class="ln-bib ln-bib--easy"><span class="ln-bib-inner">EASY</span></span>Easy + strides, 35 mnt</span>
        <span style="font-size: 13px; color: var(--text-muted)">Jadwal awal: Kamis, 29 Okt</span>
      </div>
      <a href="Plan.dc.html" aria-label="Tutup" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 84px; justify-content: center; border: 0; border-radius: var(--radius-stadium); cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.ring}}">
          <span style="font-size: 12px; font-weight: 700">{{o.dow}}</span>
          <span style="font-family: var(--font-display); font-size: 20px; font-weight: 800">{{o.date}}</span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: {{o.dot}}"></span>
        </button>
      </sc-for>
    </div>
    <div style="padding: 14px 16px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.45; color: var(--on-status); background: {{msgBg}}">{{msg}}</div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Plan.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: var(--radius-stadium); text-decoration: none; font-family: var(--font-ui); font-weight: 700; box-sizing: border-box; height: 60px; background: var(--primary); color: var(--on-primary); font-size: 17px; box-shadow: var(--shadow-raised)">{{cta}}</a>
      <a href="Plan.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 15px; font-weight: 700; color: var(--primary-ink); text-decoration: none">Lewati latihan ini</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'Jum' };
  }
  renderVals() {
    var self = this;
    var o = [
      { dow: 'Rab', date: '28', dot: 'var(--surface-sunken)', level: 'ok', msg: 'Bisa. Sehari setelah Tempo, jadi tetap pelan dan lewati strides kalau kaki masih berat.' },
      { dow: 'Kam', date: '29', dot: 'var(--zone-easy)', level: 'ok', msg: 'Ini jadwal awal.' },
      { dow: 'Jum', date: '30', dot: 'var(--surface-sunken)', level: 'ok', msg: 'Aman. Hari kosong dan tidak berurutan dengan sesi berat.' },
      { dow: 'Sab', date: '31', dot: 'var(--zone-easy)', level: 'warn', msg: 'Sabtu sudah ada Easy Run. Dua latihan digabung jadi satu: Easy 50 mnt?' },
      { dow: 'Min', date: '1', dot: 'var(--zone-long)', level: 'warn', msg: 'Tidak disarankan: Minggu adalah Long Run. Lebih baik pilih Jumat.' }
    ];
    var cur = this.state.pick;
    var sel = o.filter(function (x) { return x.dow === cur; })[0];
    var warn = sel.level === 'warn';
    return {
      opts: o.map(function (x) {
        var on = x.dow === cur;
        return {
          dow: x.dow, date: x.date, dot: x.dot, pressed: on ? 'true' : 'false',
          bg: on ? 'var(--text)' : 'var(--surface)', fg: on ? 'var(--bg)' : 'var(--text)',
          ring: on ? 'none' : 'inset 0 0 0 1.5px var(--line)',
          pick: function () { self.setState({ pick: x.dow }); }
        };
      }),
      msg: sel.msg,
      msgBg: warn ? 'var(--status-attention)' : 'var(--status-on-track)',
      cta: 'Pindahkan ke ' + sel.dow + ', ' + sel.date
    };
  }
}
</script>
</body>
</html>
