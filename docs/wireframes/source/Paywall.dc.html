<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Premium</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lintas/tokens.css">
<link rel="stylesheet" href="ds/lintas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:var(--primary-ink)}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 16px; min-height: 0">
  <div style="display: flex; align-items: center; gap: 12px"><a href="Profile.dc.html" aria-label="Tutup" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a><span style="flex: 1"></span><span style="width: 44px"></span></div>
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <span class="ln-bib ln-bib--strength"><span class="ln-bib-inner">PREMIUM</span></span>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Latihan yang benar-benar menyesuaikan dirimu</h1>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{perks}}" as="p" hint-placeholder-count="6">
      <div style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4"><span style="flex-shrink: 0; display: flex; color: var(--success-ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>{{p.text}}</span></div>
    </sc-for>
  </div>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 32px"><div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px">
    <sc-for list="{{plans}}" as="o" hint-placeholder-count="2">
      <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 18px; border: 0; border-radius: var(--radius-lg); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; box-shadow: {{o.ring}}">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">{{o.name}}</span><span style="font-size: 12px; color: var(--text-muted)">{{o.note}}</span></span>
        <span style="font-family: var(--font-display); font-size: 16px; font-weight: 800">{{o.price}}</span>
      </button>
    </sc-for>
  </div><a href="Today.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: var(--radius-stadium); text-decoration: none; font-family: var(--font-ui); font-weight: 700; box-sizing: border-box; height: 60px; background: var(--primary); color: var(--on-primary); font-size: 17px; box-shadow: var(--shadow-raised)">Coba gratis [X] hari</a><span style="text-align: center; font-size: 12px; color: var(--text-muted)">Batalkan kapan saja. Fitur gratis tetap bisa dipakai selamanya.</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: 'year' };
  }
  renderVals() {
    var self = this;
    var opts = [
      { id: 'year', name: 'Tahunan', note: 'Hemat dibanding bulanan', price: '[HARGA] /tahun' },
      { id: 'month', name: 'Bulanan', note: 'Fleksibel', price: '[HARGA] /bulan' }
    ];
    return {
      perks: [
        { text: 'Plan adaptif penuh dari RPE, detak jantung dan latihan terlewat' },
        { text: 'Prediksi waktu race + zona pace dan detak jantung detail' },
        { text: 'Riwayat grafik lengkap, bukan hanya 8 minggu' },
        { text: 'Beberapa target sekaligus dan plan custom' },
        { text: 'Plan kekuatan dan mobility untuk pelari' },
        { text: 'Kirim workout ke jam (Garmin, Apple Watch)' }
      ],
      plans: opts.map(function (o) {
        var on = o.id === self.state.plan;
        return {
          name: o.name, note: o.note, price: o.price, pressed: on ? 'true' : 'false',
          ring: on ? 'inset 0 0 0 2.5px var(--text)' : 'inset 0 0 0 1.5px var(--line)',
          pick: function () { self.setState({ plan: o.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
