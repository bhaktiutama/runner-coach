<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kalender plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAFA; color: #18181B; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 12px; min-height: 0">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Plan 10K</h1>
        <span style="font-size: 14px; color: #52525B">Race Minggu, 3 Jan 2027: 68 hari lagi</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px">
        <sc-for list="{{phases}}" as="p" hint-placeholder-count="10">
          <div style="height: 10px; border-radius: 3px; background: {{p.color}}; outline: {{p.outline}}; outline-offset: 2px"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #52525B"><span>Base</span><span>Build</span><span>Peak</span><span>Taper</span></div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Minggu sebelumnya" style="all: unset; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 15px; font-weight: 800">Minggu 3</span>
        <span style="font-size: 12px; color: #52525B">26 Okt - 1 Nov  ·  18 km</span>
      </div>
      <button type="button" aria-label="Minggu berikutnya" style="all: unset; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <a href="{{d.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 16px; background: {{d.bg}}; border: {{d.border}}; color: #18181B; text-decoration: none">
          <div style="width: 40px; display: flex; flex-direction: column; align-items: center">
            <span style="font-size: 11px; font-weight: 600; color: #52525B">{{d.dow}}</span>
            <span style="font-size: 17px; font-weight: 800">{{d.date}}</span>
          </div>
          <div style="width: 6px; height: 32px; border-radius: 3px; background: {{d.color}}"></div>
          <div style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 700; color: {{d.titleColor}}">{{d.title}}</span>
            <span style="font-size: 12px; color: #52525B">{{d.sub}}</span>
          </div>
          <span style="font-size: 11px; font-weight: 800; color: {{d.tagColor}}">{{d.tag}}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navigasi utama" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #E4E4E7; padding: 8px 8px 28px; background: #FFFFFF">
    <a href="Today.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hari ini</a>
    <a href="Plan.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #18181B; font-size: 11px; font-weight: 800; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</a>
    <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-6M11 17V6M16 17v-4M21 17V9"/></svg>Progres</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var phaseColors = ['#93C5FD', '#93C5FD', '#93C5FD', '#2563EB', '#2563EB', '#2563EB', '#F59E0B', '#F59E0B', '#A1A1AA', '#A1A1AA'];
    var C = { rest: '#E4E4E7', easy: '#2563EB', tempo: '#F59E0B', long: '#1E3A8A' };
    var rows = [
      { dow: 'Sen', date: '26', type: 'rest', title: 'Istirahat', sub: 'Jalan santai atau stretching', tag: 'SELESAI', tagColor: '#15803D' },
      { dow: 'Sel', date: '27', type: 'tempo', title: 'Tempo Run', sub: '38 mnt  ·  ~5 km', tag: 'HARI INI', tagColor: '#18181B', today: true, href: 'WorkoutDetail.dc.html' },
      { dow: 'Rab', date: '28', type: 'rest', title: 'Istirahat', sub: '', tag: '' },
      { dow: 'Kam', date: '29', type: 'easy', title: 'Easy + strides', sub: '35 mnt + 6x20 dtk', tag: '', href: 'MoveWorkout.dc.html' },
      { dow: 'Jum', date: '30', type: 'rest', title: 'Istirahat', sub: '', tag: '' },
      { dow: 'Sab', date: '31', type: 'easy', title: 'Easy Run', sub: '30 mnt  ·  ~4 km', tag: '' },
      { dow: 'Min', date: '1', type: 'long', title: 'Long Run', sub: '60 mnt  ·  ~7,5 km', tag: '' }
    ];
    return {
      phases: phaseColors.map(function (c, i) { return { color: c, outline: i === 2 ? '2px solid #18181B' : 'none' }; }),
      days: rows.map(function (r) {
        var rest = r.type === 'rest';
        return {
          dow: r.dow, date: r.date, title: r.title, sub: r.sub, tag: r.tag, tagColor: r.tagColor || '#52525B',
          color: C[r.type], href: r.href || 'WorkoutDetail.dc.html',
          titleColor: rest ? '#52525B' : '#18181B',
          bg: r.today ? '#FFFFFF' : (rest ? 'transparent' : '#FFFFFF'),
          border: r.today ? '2px solid #18181B' : (rest ? '1px dashed #D4D4D8' : '1px solid #E4E4E7')
        };
      })
    };
  }
}
</script>
</body>
</html>
