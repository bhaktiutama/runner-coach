<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kalender plan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lintas/tokens.css">
<link rel="stylesheet" href="ds/lintas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:var(--primary-ink)}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 16px; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Plan 10K</h1>
      <span style="font-size: 14px; font-weight: 600; color: var(--text-muted)">Race Minggu, 3 Jan 2027: 68 hari lagi</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{phases}}" as="p" hint-placeholder-count="10">
          <div style="height: 14px; border-radius: var(--radius-stadium); background: {{p.color}}; outline: {{p.outline}}; outline-offset: 2px"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-muted)"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--phase-base)"></span>Base</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--phase-build)"></span>Build</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--phase-peak)"></span>Peak</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--phase-taper)"></span>Taper</span></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Minggu sebelumnya" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: var(--font-display); font-size: 18px; font-weight: 800">Minggu 3</span>
        <span style="font-size: 13px; font-weight: 600; color: var(--text-muted)">26 Okt - 1 Nov  ·  18 km</span>
      </div>
      <button type="button" aria-label="Minggu berikutnya" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <a href="{{d.href}}" style="display: grid; grid-template-columns: 40px 6px 1fr auto; gap: 12px; align-items: center; min-height: 56px; padding: 8px 14px 8px 10px; border-radius: var(--radius-md); text-decoration: none; color: var(--text); background: {{d.bg}}; box-shadow: {{d.ring}}">
          <div style="display: flex; flex-direction: column; align-items: center">
            <span style="font-size: 11px; font-weight: 700; color: var(--text-muted)">{{d.dow}}</span>
            <span style="font-family: var(--font-display); font-size: 18px; font-weight: 800">{{d.date}}</span>
          </div>
          <div style="align-self: stretch; border-radius: var(--radius-stadium); background: {{d.color}}"></div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 15px; font-weight: 700; color: {{d.titleColor}}">{{d.title}}</span>
            <span style="font-size: 12px; font-weight: 600; color: var(--text-muted)">{{d.sub}}</span>
          </div>
          <sc-if value="{{d.isTag}}" hint-placeholder-val="{{false}}"><span style="padding: 4px 8px; border-radius: var(--radius-stadium); background: var(--text); color: var(--bg); font-size: 11px; font-weight: 800; letter-spacing: 0.06em">{{d.tag}}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Navigasi utama" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 28px; background: var(--surface); box-shadow: inset 0 1px 0 var(--line)"><a href="Today.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Hari ini</a><a href="Plan.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text); font-size: 12px; font-weight: 800; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: var(--surface-sunken); color: var(--text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Plan</a><a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-6M11 17V6M16 17v-4M21 17V9"/></svg></span>Progres</a><a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: var(--text-muted); font-size: 12px; font-weight: 600; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Profil</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var phase = ['base', 'base', 'base', 'build', 'build', 'build', 'peak', 'peak', 'taper', 'taper'];
    var Z = { rest: 'var(--surface-sunken)', easy: 'var(--zone-easy)', tempo: 'var(--zone-tempo)', long: 'var(--zone-long)' };
    var B = { easy: 'ln-bib ln-bib--easy', tempo: 'ln-bib ln-bib--tempo', long: 'ln-bib ln-bib--long' };
    var rows = [
      { dow: 'Sen', date: '26', type: 'rest', title: 'Istirahat', sub: 'Jalan santai atau stretching', tag: '' },
      { dow: 'Sel', date: '27', type: 'tempo', bib: 'TEMPO', title: 'Tempo Run', sub: '42 mnt  ·  ~5,5 km  ·  + drill', tag: 'HARI INI', today: true, href: 'WorkoutDetail.dc.html' },
      { dow: 'Rab', date: '28', type: 'rest', title: 'Istirahat', sub: '', tag: '' },
      { dow: 'Kam', date: '29', type: 'easy', bib: 'EASY', title: 'Easy + strides', sub: '35 mnt + 6x20 dtk', tag: '', href: 'MoveWorkout.dc.html' },
      { dow: 'Jum', date: '30', type: 'rest', title: 'Istirahat', sub: '', tag: '' },
      { dow: 'Sab', date: '31', type: 'easy', bib: 'EASY', title: 'Easy Run', sub: '30 mnt  ·  ~4 km', tag: '' },
      { dow: 'Min', date: '1', type: 'long', bib: 'LONG', title: 'Long Run', sub: '60 mnt  ·  ~7,5 km', tag: '' }
    ];
    return {
      phases: phase.map(function (p, i) { return { color: 'var(--phase-' + p + ')', outline: i === 2 ? '2px solid var(--text)' : 'none' }; }),
      days: rows.map(function (r) {
        var rest = r.type === 'rest';
        return {
          dow: r.dow, date: r.date, title: r.title, sub: r.sub, tag: r.tag, isTag: !!r.tag,
          rest: rest, work: !rest, bib: r.bib || '', bibClass: B[r.type] || '',
          color: Z[r.type], href: r.href || 'WorkoutDetail.dc.html',
          titleColor: rest ? 'var(--text-muted)' : 'var(--text)',
          bg: rest ? 'transparent' : 'var(--surface)',
          ring: r.today ? 'inset 0 0 0 2.5px var(--text)' : (rest ? 'inset 0 0 0 1.5px var(--line)' : 'var(--shadow-card)')
        };
      })
    };
  }
}
</script>
</body>
</html>
