<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding: screening kesehatan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lintas/tokens.css">
<link rel="stylesheet" href="ds/lintas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:var(--primary-ink)}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 16px; min-height: 0">
  <div style="display: flex; align-items: center; gap: 12px"><a href="OB6-Hari.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><div aria-hidden="true" style="flex: 1; display: flex; gap: 4px"><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div><div style="flex: 1; height: 8px; border-radius: var(--radius-stadium); background: var(--primary)"></div></div><span style="font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-muted)">6/6</span></div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Cek kesehatan singkat</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: var(--text-muted)">Supaya plan aman untukmu. Jawaban tidak disimpan; HP ini hanya mencatat perlu plan ringan atau tidak.</p>
  </div>
  <div style="display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card)">
    <sc-for list="{{questions}}" as="q" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; box-shadow: inset 0 -1px 0 var(--line)">
        <span style="flex: 1; font-size: 14px; line-height: 1.4; font-weight: 600">{{q.text}}</span>
        <div style="display: flex; gap: 4px; padding: 3px; border-radius: var(--radius-stadium); background: var(--surface-sunken)">
          <button type="button" style="min-width: 48px; min-height: 38px; border: 0; border-radius: var(--radius-stadium); background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600">Ya</button>
          <button type="button" aria-pressed="true" style="min-width: 56px; min-height: 38px; border: 0; border-radius: var(--radius-stadium); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 700; box-shadow: var(--shadow-card)">Tidak</button>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-md); background: var(--status-attention); color: var(--on-status); font-size: 14px; line-height: 1.45"><span style="flex-shrink: 0; display: flex; padding-top: 1px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg></span><span>Jika ada jawaban "Ya", kami sarankan konsultasi ke dokter sebelum mulai. Kamu tetap bisa lanjut dengan plan yang lebih ringan.</span></div>
  <label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.45; font-weight: 600">
    <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: var(--text)">
    Saya paham Run Coach adalah panduan latihan, bukan nasihat medis.
  </label>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 32px"><a href="OB8-Preview.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: var(--radius-stadium); text-decoration: none; font-family: var(--font-ui); font-weight: 700; box-sizing: border-box; height: 60px; background: var(--primary); color: var(--on-primary); font-size: 17px; box-shadow: var(--shadow-raised)">Buat plan saya</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      questions: [
        { text: 'Dokter pernah bilang kamu punya kondisi jantung?' },
        { text: 'Nyeri dada saat aktivitas fisik?' },
        { text: 'Pernah pingsan atau pusing berat saat olahraga?' },
        { text: 'Cedera tulang/sendi yang memburuk saat bergerak?' },
        { text: 'Sedang hamil atau baru melahirkan?' }
      ]
    };
  }
}
</script>
</body>
</html>
