<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Latihan selesai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: Inter, system-ui, sans-serif; padding: 60px 20px 32px; gap: 20px; overflow: hidden">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <div style="width: 64px; height: 64px; border-radius: 32px; background: #DCFCE7; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Tempo run selesai</h1>
    <span style="font-size: 14px; color: #52525B">3 dari 3 segmen tuntas</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #F4F4F5; font-size: 12px; font-weight: 600; color: #52525B">Durasi
      <input type="text" value="38:20" style="all: unset; font-size: 20px; font-weight: 800; color: #18181B; font-variant-numeric: tabular-nums; width: 100%">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; border: 1.5px solid #18181B; font-size: 12px; font-weight: 600; color: #52525B">Jarak (km)
      <input type="text" value="5,1" style="all: unset; font-size: 20px; font-weight: 800; color: #18181B; font-variant-numeric: tabular-nums; width: 100%">
    </label>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #F4F4F5; font-size: 12px; font-weight: 600; color: #52525B">Rata-rata
      <span style="font-size: 20px; font-weight: 800; color: #18181B; font-variant-numeric: tabular-nums">7:31</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 17px; font-weight: 800">Seberapa berat rasanya?</span>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{scale}}" as="s" hint-placeholder-count="10">
        <button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="all: unset; box-sizing: border-box; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; background: {{s.bg}}; color: {{s.fg}}">{{s.n}}</button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #52525B"><span>Sangat mudah</span><span>Sedang</span><span>Maksimal</span></div>
    <span style="font-size: 14px; color: #3F3F46; text-align: center; min-height: 20px">{{rpeText}}</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700; color: #52525B">Ada catatan? (opsional)</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" style="all: unset; height: 36px; padding: 0 12px; display: flex; align-items: center; border-radius: 18px; border: 1.5px solid #E4E4E7; font-size: 13px; font-weight: 600; cursor: pointer">Cuaca panas</button>
      <button type="button" style="all: unset; height: 36px; padding: 0 12px; display: flex; align-items: center; border-radius: 18px; border: 1.5px solid #E4E4E7; font-size: 13px; font-weight: 600; cursor: pointer">Kurang tidur</button>
      <button type="button" style="all: unset; height: 36px; padding: 0 12px; display: flex; align-items: center; border-radius: 18px; border: 1.5px solid #E4E4E7; font-size: 13px; font-weight: 600; cursor: pointer">Kaki pegal</button>
      <button type="button" style="all: unset; height: 36px; padding: 0 12px; display: flex; align-items: center; border-radius: 18px; border: 1.5px solid #FCA5A5; color: #B91C1C; font-size: 13px; font-weight: 600; cursor: pointer">Ada nyeri</button>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #EFF6FF; color: #1E3A8A; font-size: 13px; line-height: 1.4">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg>
    <span>Pakai jam? Data dari Strava / Apple Health akan otomatis melengkapi jarak dan detak jantung.</span>
  </div>

  <div style="flex: 1"></div>
  <a href="WeekDone.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #18181B; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none">Simpan</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rpe: 6 };
  }
  renderVals() {
    var self = this;
    var r = this.state.rpe;
    var text = { 1: 'Seperti jalan santai', 2: 'Sangat ringan', 3: 'Ringan, bisa ngobrol lancar', 4: 'Agak ringan', 5: 'Sedang', 6: 'Sesuai target tempo', 7: 'Berat tapi terkontrol', 8: 'Berat, sulit bicara', 9: 'Sangat berat', 10: 'Maksimal' };
    var scale = [];
    for (var i = 1; i <= 10; i++) {
      (function (n) {
        var on = n === r;
        var tint = n <= 3 ? '#DBEAFE' : n <= 6 ? '#FEF3C7' : '#FEE2E2';
        scale.push({ n: n, pressed: on ? 'true' : 'false', bg: on ? '#18181B' : tint, fg: on ? '#FFFFFF' : '#18181B', pick: function () { self.setState({ rpe: n }); } });
      })(i);
    }
    return { scale: scale, rpeText: r + ' / 10: ' + text[r] };
  }
}
</script>
</body>
</html>
