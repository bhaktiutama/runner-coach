<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAFA; color: #18181B; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 12px; min-height: 0">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 56px; height: 56px; border-radius: 28px; background: #18181B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">A</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 800">[Nama Pengguna]</span>
        <span style="font-size: 13px; color: #52525B">Paket Gratis</span>
      </div>
    </div>

    <a href="Paywall.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #18181B; color: #FFFFFF; text-decoration: none">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 800">Coba Premium</span>
        <span style="font-size: 12px; color: #D4D4D8">Plan adaptif penuh, prediksi race, riwayat lengkap</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #52525B; padding-left: 4px">{{g.title}}</span>
        <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E4E7; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="{{r.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; padding: 0 14px; border-bottom: 1px solid #F4F4F5; color: {{r.color}}; text-decoration: none; font-size: 15px; font-weight: 600">
              <span>{{r.label}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #52525B">{{r.value}}
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Navigasi utama" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #E4E4E7; padding: 8px 8px 28px; background: #FFFFFF">
    <a href="Today.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hari ini</a>
    <a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</a>
    <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #71717A; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-6M11 17V6M16 17v-4M21 17V9"/></svg>Progres</a>
    <a href="Profile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: #18181B; font-size: 11px; font-weight: 800; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ink = '#18181B';
    return {
      groups: [
        { title: 'LATIHAN', rows: [
          { label: 'Target aktif', value: '10K, 3 Jan 2027', href: 'OB2-Target.dc.html', color: ink },
          { label: 'Zona pace', value: 'Easy 7:40-8:20', href: 'OB8-Preview.dc.html', color: ink },
          { label: 'Hari & pengingat', value: '4 hari, 05:30', href: 'OB6-Hari.dc.html', color: ink },
          { label: 'Saya cedera / sakit', value: 'Jeda plan', href: 'InjuryPause.dc.html', color: '#B91C1C' }
        ] },
        { title: 'DATA', rows: [
          { label: 'Integrasi', value: 'Strava terhubung', href: 'Integrations.dc.html', color: ink },
          { label: 'Satuan', value: 'km', href: 'Profile.dc.html', color: ink }
        ] },
        { title: 'AKUN', rows: [
          { label: 'Privasi & export data', value: '', href: 'Profile.dc.html', color: ink },
          { label: 'Hapus akun', value: '', href: 'Profile.dc.html', color: '#B91C1C' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
