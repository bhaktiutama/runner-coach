<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Timer berjalan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lintas/tokens.css">
<link rel="stylesheet" href="ds/lintas/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:var(--primary-ink)}
button{font-family:inherit}
</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-feature-settings: 'tnum' 1; overflow: hidden">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 16px; min-height: 0">
    <div style="display: flex; align-items: center; justify-content: space-between"><a href="Finish.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: var(--radius-stadium); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700; text-decoration: none">Akhiri</a><span style="font-size: 14px; font-weight: 700; color: var(--text-muted)">Segmen 3 dari 4</span><button type="button" aria-label="Suara aktif" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg></button></div>
    <div style="position: relative; display: flex; align-items: center; justify-content: center; height: 300px">
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><svg width="350" height="300" viewBox="0 0 350 300" role="img" aria-label="Segmen tempo 38 persen selesai"><rect x="7.0" y="7.0" width="336" height="286" rx="143.0" fill="none" stroke="var(--surface-sunken)" stroke-width="14"/><rect x="7.0" y="7.0" width="336" height="286" rx="143.0" fill="none" stroke="var(--zone-interval-stroke)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="38 100"/></svg></div>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span class="ln-bib ln-bib--tempo"><span class="ln-bib-inner">TEMPO</span></span>
        <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: var(--status-attention)">DIJEDA</span>
        </sc-if>
        <span style="font-family: var(--font-display); font-size: 88px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">08:42</span>
        <span style="font-size: 14px; font-weight: 600; color: var(--text-muted)">sisa dari 14:00</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--surface)">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-muted)">Target pace</span>
        <span style="font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.1">6:45<span style="font-size: 15px; color: var(--text-muted)"> /km</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--surface)">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-muted)">Rasa</span>
        <span style="font-size: 15px; font-weight: 700; line-height: 1.3">Nyaman tapi berat (6-7)</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div aria-hidden="true" style="display: flex; gap: 4px"><div style="flex: 10; height: 8px; border-radius: var(--radius-stadium); background: var(--zone-easy); opacity: .45"></div><div style="flex: 8; height: 8px; border-radius: var(--radius-stadium); background: repeating-linear-gradient(135deg, var(--zone-easy) 0 5px, var(--surface) 5px 8px); opacity: .45"></div><div style="flex: 14; height: 8px; border-radius: var(--radius-stadium); background: var(--zone-tempo)"></div><div style="flex: 10; height: 8px; border-radius: var(--radius-stadium); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line)"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-muted)">
        <span style="font-family: var(--font-display)">Total 23:18 / 42:00</span>
        <span>Berikutnya: Pendinginan 10:00</span>
      </div>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 28px; padding: 8px 20px 12px">
    <button type="button" aria-label="Kunci layar" style="width: 56px; height: 56px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
    <button type="button" aria-label="{{pauseLabel}}" onClick="{{toggle}}" style="width: 88px; height: 88px; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary); cursor: pointer">
      <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg></sc-if>
      <sc-if value="{{running}}" hint-placeholder-val="{{true}}"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/></svg></sc-if>
    </button>
    <button type="button" aria-label="Lewati segmen" style="width: 56px; height: 56px; flex-shrink: 0; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l9 7-9 7z" fill="currentColor"/><path d="M19 5v14"/></svg></button>
  </div>
  <span style="padding: 0 32px 32px; text-align: center; font-size: 12px; line-height: 1.45; color: var(--text-muted)">Suara + getar di setiap pergantian segmen, juga saat layar terkunci</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
  }
  renderVals() {
    var self = this;
    var p = this.state.paused;
    return {
      paused: p,
      running: !p,
      pauseLabel: p ? 'Lanjutkan' : 'Jeda',
      toggle: function () { self.setState({ paused: !self.state.paused }); }
    };
  }
}
</script>
</body>
</html>
