<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Timer latihan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#FCD34D}a:hover{color:#FDE68A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; background: #0A0A0A; color: #FAFAFA; font-family: Inter, system-ui, sans-serif; padding: 52px 24px 40px; gap: 20px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Finish.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 15px; font-weight: 700; color: #A1A1AA; text-decoration: none">Akhiri</a>
    <span style="font-size: 14px; font-weight: 700; color: #D4D4D8">Segmen 2 dari 3</span>
    <button type="button" aria-label="Suara aktif" style="all: unset; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #D4D4D8; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/></svg>
    </button>
  </div>

  <div style="display: flex; justify-content: center">
    <span style="padding: 8px 16px; border-radius: 12px; background: #F59E0B; color: #1C1917; font-size: 16px; font-weight: 900; letter-spacing: 0.12em">TEMPO</span>
  </div>

  <div style="position: relative; width: 300px; height: 300px; align-self: center">
    <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)">
      <circle cx="150" cy="150" r="130" fill="none" stroke="#27272A" stroke-width="16"/>
      <circle cx="150" cy="150" r="130" fill="none" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" stroke-dasharray="816.8" stroke-dashoffset="507.6"/>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.12em; color: #FCD34D">DIJEDA</span>
      </sc-if>
      <span style="font-size: 84px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">08:42</span>
      <span style="font-size: 15px; font-weight: 600; color: #A1A1AA">sisa dari 14:00</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; background: #18181B">
      <span style="font-size: 12px; font-weight: 600; color: #A1A1AA">Target pace</span>
      <span style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">6:45<span style="font-size: 14px; color: #A1A1AA"> /km</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; background: #18181B">
      <span style="font-size: 12px; font-weight: 600; color: #A1A1AA">Rasa</span>
      <span style="font-size: 15px; font-weight: 700; line-height: 1.3">Nyaman tapi berat (6-7)</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="position: relative; display: flex; gap: 3px; height: 8px" aria-hidden="true">
      <div style="flex: 12; border-radius: 4px; background: #3B82F6"></div>
      <div style="flex: 14; border-radius: 4px; background: #F59E0B"></div>
      <div style="flex: 12; border-radius: 4px; background: #3F3F46"></div>
      <div style="position: absolute; left: 45.5%; top: -5px; width: 4px; height: 18px; border-radius: 2px; background: #FFFFFF"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A1A1AA; font-weight: 600">
      <span>Total 17:18 / 38:00</span>
      <span>Berikutnya: Pendinginan 12:00</span>
    </div>
  </div>

  <div style="flex: 1"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
    <button type="button" aria-label="Kunci layar" style="all: unset; width: 60px; height: 60px; border-radius: 30px; background: #18181B; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
    </button>
    <button type="button" aria-label="{{pauseLabel}}" onClick="{{toggle}}" style="all: unset; width: 96px; height: 96px; border-radius: 48px; background: #FAFAFA; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="#0A0A0A" aria-hidden="true"><path d="M7 4.5v15a1 1 0 001.5.9l12-7.5a1 1 0 000-1.8l-12-7.5A1 1 0 007 4.5z"/></svg>
      </sc-if>
      <sc-if value="{{running}}" hint-placeholder-val="{{true}}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="#0A0A0A" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </sc-if>
    </button>
    <button type="button" aria-label="Lewati segmen" style="all: unset; width: 60px; height: 60px; border-radius: 30px; background: #18181B; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l10 7-10 7V5zM19 5v14"/></svg>
    </button>
  </div>
  <span style="text-align: center; font-size: 12px; color: #A1A1AA">Suara + getar di setiap pergantian segmen, juga saat layar terkunci</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
  }
  renderVals() {
    var self = this;
    var p = this.state.paused;
    return {
      paused: p,
      running: !p,
      pauseLabel: p ? 'Lanjutkan' : 'Jeda',
      toggle: function () { self.setState({ paused: !self.state.paused }); }
    };
  }
}
</script>
</body>
</html>
