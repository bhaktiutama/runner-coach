<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump squat: rig kaku dari 9 pose foto</title>
<style>
  :root { --bg:#F6F6F7; --card:#fff; --ink:#18181B; --muted:#52525B; --line:#E4E4E7;
          --skin:#E2B898; --top:#5F6B85; --shorts:#232326; --shoe:#B9BFCC; --sole:#8E94A3; --stage:#EDEDEF; --hair:#1F1B1B; --floor:#D4D4D8; }
  @media (prefers-color-scheme: dark) { :root { --stage:#27272A; --bg:#0A0A0A; --card:#18181B; --ink:#FAFAFA; --muted:#A1A1AA; --line:#27272A; --floor:#27272A; } }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; }
  main { max-width:420px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:12px; }
  svg { width:100%; height:auto; display:block; }
  .bar { display:flex; gap:8px; align-items:center; margin-top:10px; font-size:14px; }
  button { height:40px; padding:0 14px; border-radius:20px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-weight:600; }
  input[type=range] { flex:1; }
  .note { margin-top:10px; font-size:12px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg id="fig" viewBox="50 -50 300 468" role="img" aria-label="Animasi jump squat"></svg>
    <div class="bar">
      <button id="pp" aria-pressed="true">Jeda</button>
      <input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="Posisi animasi">
    </div>
  </div>
  <p class="note">Rig kaku: 7 segmen diputar dari 9 pose foto (sudut sendi hasil MediaPipe). Digerakkan lewat JavaScript, tanpa SMIL atau CSS keyframes, supaya sama di semua viewer.</p>
</main>
<script>
const DATA = __DATA__;
const DUR = __DUR__;               // detik dari pose i ke i+1 (pose terakhir kembali ke pose 0)
const K = DATA.keys, L = DATA.lengths;
const A0 = 352.3, AX = 205;        // posisi pergelangan kaki saat berpijak (px panel)
const NAMES = ['torso','head','ua','fa','th','sh','ft','lift'];
const TOTAL = DUR.reduce((a,b)=>a+b,0);
const ease = t => t*t*(3-2*t);
function pose(time) {
  let t = ((time % TOTAL) + TOTAL) % TOTAL, i = 0;
  while (t > DUR[i]) { t -= DUR[i]; i++; }
  const u = ease(t / DUR[i]), a = K[i], b = K[(i+1) % K.length], o = {};
  for (const n of NAMES) o[n] = a[n] + (b[n]-a[n]) * u;
  return o;
}
const v = (deg,len) => [Math.sin(deg*Math.PI/180)*len, Math.cos(deg*Math.PI/180)*len];
const add = (p,q) => [p[0]+q[0], p[1]+q[1]];
function solve(p) {
  const th = v(p.th,L.th), sh = v(p.sh,L.sh);
  const ank = [AX, A0 - p.lift];
  const hip = [ank[0]-th[0]-sh[0], ank[1]-th[1]-sh[1]];
  const knee = add(hip,th), sho = add(hip, v(p.torso,L.torso));
  const el = add(sho, v(p.ua,L.ua)), wr = add(el, v(p.fa,L.fa));
  return { hip, knee, ank, toe: add(ank, v(p.ft,L.ft)), sho, el, wr, head: add(sho, v(p.head,L.head)) };
}
const f = n => n.toFixed(1);
const seg = (a,b,w,c,extra='') => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
function draw(time) {
  const p = pose(time), j = solve(p);
  const waist = lerp(j.hip, j.sho, 0.2), midr = lerp(j.hip, j.sho, 0.5), thighTop = lerp(j.hip, j.knee, 0.5);
  const hairBack = add(j.head, [-14,-4]);
  const tail = add(hairBack, v(p.torso - 180 - 25, 26)), tail2 = add(hairBack, v(p.torso - 180 - 8, 56));
  const g = [];
  g.push(`<rect x="50" y="-50" width="300" height="468" fill="var(--stage)"/>`);
  g.push(`<ellipse cx="${AX}" cy="${A0+18}" rx="80" ry="7" fill="var(--floor)"/>`);
  g.push(`<path d="M${f(hairBack[0])} ${f(hairBack[1])} Q${f(tail[0])} ${f(tail[1])} ${f(tail2[0])} ${f(tail2[1])}" stroke="var(--hair)" stroke-width="13" stroke-linecap="round" fill="none"/>`);
  g.push(seg(j.knee, j.ank, 22, 'var(--skin)'));
  g.push(seg(j.ank, j.toe, 18, 'var(--shoe)'));
  g.push(seg(j.hip, j.knee, 34, 'var(--skin)'));
  g.push(seg(j.hip, j.sho, 44, 'var(--skin)'));
  g.push(seg(lerp(j.hip,j.sho,0.42), j.sho, 46, 'var(--top)'));
  g.push(seg(waist, j.hip, 46, 'var(--shorts)'));
  g.push(seg(j.hip, thighTop, 42, 'var(--shorts)'));
  g.push(seg(j.sho, j.head, 14, 'var(--skin)'));
  g.push(`<ellipse cx="${f(j.head[0])}" cy="${f(j.head[1])}" rx="20" ry="23" fill="var(--skin)"/>`);
  g.push(`<path d="M${f(j.head[0]-2)} ${f(j.head[1]-23)} Q${f(j.head[0]-24)} ${f(j.head[1]-18)} ${f(j.head[0]-20)} ${f(j.head[1]+8)} Q${f(j.head[0]-8)} ${f(j.head[1]-6)} ${f(j.head[0]+14)} ${f(j.head[1]-14)} Z" fill="var(--hair)"/>`);
  g.push(`<circle cx="${f(j.head[0]+20)}" cy="${f(j.head[1]+3)}" r="3.6" fill="var(--skin)"/>`);
  g.push(seg(j.sho, j.el, 17, 'var(--skin)'));
  g.push(seg(j.el, j.wr, 13, 'var(--skin)'));
  g.push(`<circle cx="${f(j.wr[0])}" cy="${f(j.wr[1])}" r="7" fill="var(--skin)"/>`);
  document.getElementById('fig').innerHTML = g.join('');
}
// pose penuh (waktu awal tiap kunci) untuk QA
const START = DUR.reduce((acc,d,i)=>(acc.push(i? acc[i-1]+DUR[i-1] : 0),acc),[]);
window.renderKey = i => { draw(START[i] + 1e-6); };
const q = new URLSearchParams(location.search);
const pp = document.getElementById('pp'), seek = document.getElementById('seek');
let playing = !q.has('key'), t0 = performance.now(), off = 0;
if (q.has('key')) renderKey(+q.get('key'));
function frame(now) {
  if (playing) { off = ((now - t0)/1000) % TOTAL; seek.value = off/TOTAL; draw(off); }
  requestAnimationFrame(frame);
}
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches || q.has('key')) requestAnimationFrame(frame);
else { playing = false; pp.textContent='Putar'; pp.setAttribute('aria-pressed','false'); draw(START[0]); }
pp.onclick = () => { playing = !playing; if (playing) t0 = performance.now() - off*1000;
  pp.textContent = playing ? 'Jeda' : 'Putar'; pp.setAttribute('aria-pressed', playing); };
seek.oninput = () => { playing = false; pp.textContent='Putar'; pp.setAttribute('aria-pressed','false'); off = seek.value*TOTAL; draw(off); };
if (!q.has('key')) draw(0);
</script>
</body>
</html>
